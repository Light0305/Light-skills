[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "light-crawl"
version = "1.3.0"
description = "A routing-first crawler skill: probe, reverse, rebuild, crawl, verify, learn."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "light-crawl" }]
keywords = ["crawler", "scraping", "reverse-engineering", "scrapling", "js-reverse", "rea"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]
dependencies = []

[project.optional-dependencies]
fetchers = ["scrapling[fetchers]>=0.5,<0.6"]
ai = ["scrapling[ai]>=0.5,<0.6"]
dev = ["pytest>=8", "pytest-cov>=5"]

[project.scripts]
light-crawl = "light_crawl.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
light_crawl = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
